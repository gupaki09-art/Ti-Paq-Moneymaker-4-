name: Capture daily market close
on:
  schedule:
    - cron: '25,45 20,21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-close-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/capture-close.cjs
      - name: Commit daily archive when changed
        run: |
          if ! git diff --quiet -- data/final-closes.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/final-closes.json
            git commit -m "Archive final market estimate"
            git push
          fi
