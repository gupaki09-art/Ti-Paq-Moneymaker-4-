<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ti-Paq Moneymaker 5.0</title><style>:root{font-family:system-ui;color-scheme:dark}body{margin:0;background:#0f1318;color:#f2f5f7}main{max-width:1000px;margin:auto;padding:20px}.card{background:#192028;border:1px solid #303a45;border-radius:16px;padding:17px;margin-bottom:13px}.weekHead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.weekHead select{min-width:280px;padding:9px;border-radius:8px;background:#10161c;color:#fff;border:1px solid #46515e}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #303a45;text-align:right}th:first-child,td:first-child{text-align:left}.muted,small{color:#9da9b5}.weekTotal{font-size:1.45rem;font-weight:850}.pos{color:#59d68d}.neg{color:#ff7474}.weeklyChartWrap{height:330px;position:relative;margin-top:18px}.weeklyChartWrap canvas{width:100%;height:100%}.legend{display:flex;gap:20px;flex-wrap:wrap;margin:8px 0}.legend span:before{content:'●';margin-right:6px}.estimated:before{color:#66aaff}.actual:before{color:#59d68d}</style></head><body><main id="app"><h1>Ti-Paq Moneymaker 5.0</h1><p class="muted">Bilans et graphiques hebdomadaires archivés</p><div class="card"><div class="weekHead"><h2 style="margin-right:auto">Bilans hebdomadaires</h2><select id="weekSelect"></select></div><p id="weekNote" class="muted"></p><table><thead><tr><th>Jour</th><th>Estimé 16 h</th><th>Réel</th></tr></thead><tbody id="weekBody"></tbody></table><p>Total réel de la semaine : <span id="weekTotal" class="weekTotal">—</span></p><h3>Graphique hebdomadaire — estimé vs réel</h3><div class="legend"><span class="estimated">Rendement estimé à 16 h</span><span class="actual">Rendement réel</span></div><div class="weeklyChartWrap"><canvas id="weeklyChart"></canvas></div><p id="weeklyChartNote"><small></small></p></div></main><script>const $=id=>document.getElementById(id);const cad=n=>new Intl.NumberFormat('fr-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0,signDisplay:'always'}).format(n);const weeklyArchive={'2026-09-21':{label:'Semaine du 21 au 25 septembre 2026',note:'Semaine terminée — conservée dans l’historique.',days:[['Lun. 21',null,2390],['Mar. 22',null,3407],['Mer. 23',null,-2813],['Jeu. 24',null,-368],['Ven. 25',796,508]]}};function mondayKey(d=new Date()){const s=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit'}).format(d),x=new Date(s+'T12:00:00');const day=x.getDay(),diff=day===0?-6:1-day;x.setDate(x.getDate()+diff);return x.toISOString().slice(0,10)}function fmtWeek(key){const m=new Date(key+'T12:00:00'),f=new Date(m);f.setDate(m.getDate()+4);return 'Semaine du '+m.toLocaleDateString('fr-CA',{day:'numeric',month:'long',timeZone:'America/Toronto'})+' au '+f.toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric',timeZone:'America/Toronto'})}function setupWeeks(){const current=mondayKey(),sel=$('weekSelect');if(!weeklyArchive[current])weeklyArchive[current]={label:fmtWeek(current),note:'Semaine courante — les rendements seront compilés indépendamment.',days:[['Lundi',null,null],['Mardi',null,null],['Mercredi',null,null],['Jeudi',null,null],['Vendredi',null,null]]};const keys=Object.keys(weeklyArchive).sort().reverse();sel.innerHTML=keys.map(k=>`<option value="${k}">${weeklyArchive[k].label}${k===current?' — courante':''}</option>`).join('');sel.value=current;sel.onchange=renderWeek;renderWeek()}function renderWeek(){const w=weeklyArchive[$('weekSelect').value];$('weekNote').textContent=w.note;$('weekBody').innerHTML=w.days.map(d=>`<tr><td>${d[0]}</td><td>${typeof d[1]==='number'?cad(d[1]):'—'}</td><td>${typeof d[2]==='number'?cad(d[2]):'—'}</td></tr>`).join('');const vals=w.days.map(d=>d[2]).filter(Number.isFinite),sum=vals.reduce((a,b)=>a+b,0);$('weekTotal').textContent=vals.length?cad(sum):'—';$('weekTotal').className='weekTotal '+(sum>=0?'pos':'neg');drawWeeklyChart(w)}function drawWeeklyChart(w){const c=$('weeklyChart'),r=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const W=r.width,H=r.height,L=64,R=18,T=18,B=42,pw=W-L-R,ph=H-T-B;const values=w.days.flatMap(d=>[d[1],d[2]]).filter(Number.isFinite).concat([0]);const mn=Math.min(...values),mx=Math.max(...values),pad=Math.max(250,(mx-mn)*.15),lo=mn-pad,hi=mx+pad,range=hi-lo||1;x.clearRect(0,0,W,H);x.font='12px system-ui';x.fillStyle='#9da9b5';x.strokeStyle='#303a45';for(let i=0;i<=4;i++){const y=T+ph*i/4,val=hi-range*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();x.fillText(Math.round(val)+' $',3,y+4)}const xpos=i=>L+(pw*(i/(w.days.length-1||1)));w.days.forEach((d,i)=>x.fillText(d[0],xpos(i)-18,H-13));function line(index,color){let started=false;x.strokeStyle=color;x.lineWidth=2.5;x.beginPath();w.days.forEach((d,i)=>{const v=d[index];if(!Number.isFinite(v)){started=false;return}const px=xpos(i),py=T+(hi-v)/range*ph;if(!started){x.moveTo(px,py);started=true}else x.lineTo(px,py)});x.stroke();w.days.forEach((d,i)=>{const v=d[index];if(!Number.isFinite(v))return;const px=xpos(i),py=T+(hi-v)/range*ph;x.beginPath();x.arc(px,py,4,0,Math.PI*2);x.fillStyle=color;x.fill()})}line(1,'#66aaff');line(2,'#59d68d');const est=w.days.filter(d=>Number.isFinite(d[1])).length,real=w.days.filter(d=>Number.isFinite(d[2])).length;$('weeklyChartNote').innerHTML='<small>'+real+' rendement(s) réel(s) et '+est+' estimation(s) de clôture disponibles. Les données manquantes ne sont pas reconstruites artificiellement.</small>'}window.addEventListener('resize',()=>drawWeeklyChart(weeklyArchive[$('weekSelect').value]));setupWeeks();</script></body></html>
